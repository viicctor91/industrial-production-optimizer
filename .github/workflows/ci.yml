name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend - Java 21 / Quarkus
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: optimizer
          POSTGRES_USER: optimizer
          POSTGRES_PASSWORD: optimizer
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U optimizer -d optimizer"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://localhost:5432/optimizer
      QUARKUS_DATASOURCE_USERNAME: optimizer
      QUARKUS_DATASOURCE_PASSWORD: optimizer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend tests
        working-directory: backend
        run: mvn --batch-mode clean test

  frontend:
    name: Frontend - Vue / TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run

      - name: Build frontend
        working-directory: frontend
        run: npm run build
