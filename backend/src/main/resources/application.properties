quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Origin,Content-Type,Accept,Authorization
quarkus.http.cors.exposed-headers=Location
quarkus.http.cors.access-control-allow-credentials=true
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true

# Default datasource: local docker Postgres
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/optimizer
quarkus.datasource.username=optimizer
quarkus.datasource.password=optimizer
quarkus.hibernate-orm.database.generation=none

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# Supabase profile (optional)
%supabase.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL}
%supabase.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME}
%supabase.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD}
# sslmode=require can be appended to the supplied URL if not present
%supabase.quarkus.datasource.jdbc.additional-jdbc-properties=sslmode=require
